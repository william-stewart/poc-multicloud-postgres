# Install with: pre-commit install
# (default_install_hook_types installs both the pre-commit and commit-msg hooks.)
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: no-commit-to-branch
        args: [--branch, main]

  # Secret scanning on every commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  # Security and compliance scanning for IaC (and Kubernetes/Helm later).
  - repo: https://github.com/bridgecrewio/checkov
    rev: 286946086f105c8edee1d9968823671da17b7242  # frozen: 3.4.6
    hooks:
      - id: checkov
        args: [--config-file, .checkov.yaml]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 81d3af62ea96a1f69f0cfa8745f253d3c4740896  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, chore, refactor, test, ci]

  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        language: system
        entry: tofu fmt -check -diff -recursive infra
        files: \.(tf|tftest\.hcl)$
        pass_filenames: false

      - id: tflint
        name: tflint
        language: system
        entry: bash -c 'tflint --init --config "$PWD/.tflint.hcl" >/dev/null && tflint --chdir infra --recursive --config "$PWD/.tflint.hcl" --format compact'
        files: \.tf$
        pass_filenames: false

      - id: trivy-config
        name: trivy config
        language: system
        entry: trivy config --quiet --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --skip-dirs "**/.terraform" --skip-dirs "**/.external_modules" infra
        files: \.tf$
        pass_filenames: false

      - id: module-contracts
        name: per-cloud modules honour their shared interface
        language: python
        entry: python scripts/check_module_contracts.py
        files: ^(infra/modules/|scripts/check_module_contracts\.py$)
        pass_filenames: false

      # Guardrails that encode the project's own rules.
      - id: no-iam-access-keys
        name: no aws_iam_access_key in OpenTofu (keys must never reach state)
        language: pygrep
        entry: 'resource\s+"aws_iam_access_key"'
        files: \.tf$

      - id: no-in-cluster-providers
        name: no helm/kubernetes/kubectl providers in OpenTofu
        language: pygrep
        entry: '(provider\s+"(helm|kubernetes|kubectl)")|(source\s*=\s*"[^"]*/(helm|kubernetes|kubectl)")'
        files: \.tf$

      - id: no-local-only-files
        name: local-only planning files must not be committed
        language: fail
        entry: these files are local-only and listed in .git/info/exclude
        files: ^(PLAN\.md|CLAUDE\.md|\.claude/)

      - id: no-ai-attribution
        name: no AI attribution trailers in commit messages
        language: pygrep
        entry: '(?i)(co-authored-by:.*(claude|anthropic|copilot|openai|chatgpt))|(generated (with|by) .*(claude|ai\b|copilot|chatgpt))'
        stages: [commit-msg]
