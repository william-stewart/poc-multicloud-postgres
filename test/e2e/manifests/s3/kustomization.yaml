# A local S3 server standing in for both clouds' object storage: the bucket
# aws-archive plays S3 and gcs-archive plays GCS. SeaweedFS, because MinIO no
# longer publishes community images. Its credentials are generated by
# test/e2e/run.sh at every run and never written to disk.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: s3-emulator
resources:
  - namespace.yaml
  - seaweedfs.yaml
