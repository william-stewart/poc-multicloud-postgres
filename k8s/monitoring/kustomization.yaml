# Prometheus and Grafana for the PostgreSQL dashboard. make e2e installs this
# chart locally (E2E_MONITORING=1), with the same version and values, and then
# applies ./config. No Flux Kustomization points here yet: on EKS and GKE it
# also needs an allow rule from this namespace to the instances' metrics port
# (9187) in k8s/policies, and ./config must apply after the chart's CRDs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - sources.yaml
  - kube-prometheus-stack/helmrelease.yaml

# Same pattern as k8s/platform/base: stable names, watched by helm-controller.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: kube-prometheus-stack-values
    namespace: monitoring
    files:
      - values.yaml=kube-prometheus-stack/values.yaml
