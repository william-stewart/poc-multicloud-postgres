# Cilium is the only CNI, so nothing (including Flux) can run before it.
# bootstrap.sh installs this same release once with the Helm CLI, from the same
# values files; Flux then takes over the existing release and keeps it in sync.
# Values: cilium/values.yaml (shared), then <cloud>/cilium-values.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  releaseName: cilium
  chart:
    spec:
      chart: cilium
      version: "1.20.5"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values-base
      valuesKey: values.yaml
    - kind: ConfigMap
      name: cilium-values-cloud
      valuesKey: values.yaml
