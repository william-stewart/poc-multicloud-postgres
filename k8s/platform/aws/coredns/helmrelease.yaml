apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: kube-system
  annotations:
    # Deleting this HelmRelease would uninstall cluster DNS on EKS, and Flux
    # needs DNS to reach git, so it couldn't recover. Flux never prunes it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  releaseName: coredns
  chart:
    spec:
      chart: coredns
      version: "1.50.8"
      sourceRef:
        kind: HelmRepository
        name: coredns
        namespace: flux-system
  dependsOn:
    - name: cilium
      namespace: kube-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: coredns-values
      valuesKey: values.yaml
