# EBS volumes for CloudNativePG on EKS. Not an EKS add-on here, so it comes
# from Helm.
controller:
  serviceAccount:
    # Must match the IRSA trust policy in infra/modules/cluster/aws.
    name: ebs-csi-controller-sa
    annotations:
      eks.amazonaws.com/role-arn: ${EBS_CSI_ROLE_ARN}

storageClasses:
  - name: gp3
    annotations:
      storageclass.kubernetes.io/is-default-class: "true"
    # Create each volume in the AZ of the pod that first uses it.
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    # Keep the EBS volume when its PVC (or the Cluster) is deleted, so no
    # mistake in git or kubectl deletes data. The README's teardown switches
    # the PVs to Delete first.
    reclaimPolicy: Retain
    parameters:
      type: gp3
      encrypted: "true"
