# Base backups to S3: one as soon as the cluster is ready (the replica can't
# bootstrap until it exists), then nightly at 02:00 UTC.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-primary-nightly
  namespace: cnpg-db
spec:
  cluster:
    name: pg-primary
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
