# The EKS member of the distributed topology, and its primary while
# replica.primary names pg-primary. Switchover, failover and failback change
# replica.primary on both Clusters; see "Switchover, failover and failback" in
# the README.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-primary
  namespace: cnpg-db
  annotations:
    # Never let a change in git delete the database: Flux won't prune it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  # imageName comes from k8s/data/components/postgres-image, shared with the
  # GKE replica, which must run the same PostgreSQL major.
  primaryUpdateStrategy: unsupervised

  # Which member is the primary of the whole topology, and where this one
  # replays from when it isn't (after a switchover to GCP).
  replica:
    primary: pg-primary
    source: pg-replica

  bootstrap:
    initdb:
      database: app
      owner: app
  enableSuperuserAccess: false

  postgresql:
    parameters:
      # Switch WAL segments at least every minute, so a quiet database still
      # ships WAL to S3 and the replica lags by about a minute at most.
      archive_timeout: "60s"

  # WAL archiving and base backups go through the Barman Cloud plugin.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: aws-store

  # The distributed topology: every Cluster lists every member, each read
  # through its archive. pg-replica's GCS archive is read-only from here. The validator checks both sides agree.
  externalClusters:
    - name: pg-primary
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: aws-store
          serverName: pg-primary
    - name: pg-replica
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: gcs-store-ro
          serverName: pg-replica

  # The instances (and the plugin's sidecar) run as the pg-primary service
  # account, which the writer role in infra/30-data/aws trusts, and which
  # Workload Identity Federation lets read the GCS archive (infra/30-data/gcp).
  serviceAccountTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: ${WAL_WRITER_ROLE_ARN}

  storage:
    size: 10Gi
    storageClass: gp3

  # WAL on its own volume. If archiving to S3 stalls, WAL piles up here, not
  # on the data volume: PostgreSQL stops when it's full, but the data volume
  # stays intact and this one can be expanded online. At archive_timeout 60s
  # a quiet database writes about 1GiB of WAL an hour, so 10Gi buys roughly
  # ten hours to notice a stalled archive.
  walStorage:
    size: 10Gi
    storageClass: gp3

  # One instance per node, so losing a node never loses both.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  # Requests equal limits: Guaranteed QoS, so under node pressure the
  # database is the last pod evicted or OOM-killed, not the first.
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
