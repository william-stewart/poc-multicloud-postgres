# Where pg-primary archives WAL and base backups: s3://<bucket>/pg-primary/.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: aws-store
  namespace: cnpg-db
spec:
  # Barman deletes base backups (and the WAL they need) older than this.
  retentionPolicy: "7d"
  # The plugin's sidecar in each instance pod. Requests equal limits, like the
  # postgres container's, or the whole pod drops out of Guaranteed QoS.
  # The sidecar runs barman-cloud (Python), compressing and uploading in
  # parallel; at 100m CPU and 128Mi it crashed mid-backup in make e2e.
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
  configuration:
    destinationPath: s3://${WAL_BUCKET}/
    s3Credentials:
      # IRSA: the instances' service account carries the writer role (see
      # cluster.yaml). EKS's webhook also injects AWS_REGION.
      inheritFromIAMRole: true
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
      jobs: 2
