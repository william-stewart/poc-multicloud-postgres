# Database clusters live here on both clouds; default-deny network policies
# for this namespace come with k8s/policies.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-db
  annotations:
    # Deleting the namespace deletes the Clusters and PVCs in it, whatever
    # their own annotations say, so Flux must never prune it either.
    kustomize.toolkit.fluxcd.io/prune: disabled
