# The GKE member of the distributed topology: a replica cluster while
# replica.primary names pg-primary. It bootstraps from pg-primary's latest base
# backup in S3, then keeps replaying WAL from that archive. There is no network path between the
# clouds; replication lag is bounded by the primary's archive_timeout (60s).
#
# It also keeps its own archive in GCS (gcs-store): every WAL segment it
# replays is archived again there, and it takes its own base backups. The
# GCP side never depends on S3 to recover, and a promoted replica already has
# somewhere to archive, under its own name (pg-replica/), never pg-primary/.
#
# Switchover, failover and failback change replica.primary on both Clusters;
# see "Switchover, failover and failback" in the README.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-replica
  namespace: cnpg-db
  annotations:
    # Never let a change in git delete the database: Flux won't prune it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  # imageName comes from k8s/data/components/postgres-image, shared with the
  # primary: replaying its WAL needs the same PostgreSQL major.
  enableSuperuserAccess: false

  # Which member is the primary of the whole topology, and where this one
  # replays from while it isn't.
  replica:
    primary: pg-primary
    source: pg-primary

  bootstrap:
    recovery:
      source: pg-primary
      database: app
      owner: app
      # The same app owner credentials on every member (make app-credentials),
      # as CloudNativePG requires for a distributed topology.
      secret:
        name: app-owner

  postgresql:
    parameters:
      # Only takes effect while this cluster is the primary: then it ships WAL
      # to GCS at least every minute, as pg-primary does to S3.
      archive_timeout: "60s"

  # WAL archiving and base backups go to GCS. CloudNativePG runs a replica
  # cluster with archive_mode=always, so this archives the WAL it replays.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: gcs-store

  # The instances (and the plugin's sidecar) run as the pg-replica service
  # account, which Workload Identity maps to the writer in infra/30-data/gcp.
  serviceAccountTemplate:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: ${GCS_WAL_WRITER_SA}

  # The distributed topology: every Cluster lists every member, each read
  # through its archive. pg-primary's S3 archive is read-only from here. The validator checks both sides agree.
  externalClusters:
    - name: pg-primary
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: aws-store-ro
          serverName: pg-primary
    - name: pg-replica
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: gcs-store
          serverName: pg-replica

  storage:
    size: 10Gi
    # pd-balanced, encrypted at rest, kept when the PVC is deleted
    # (k8s/platform/gcp/storageclass.yaml).
    storageClass: pd-balanced-retain

  # WAL on its own volume, sized like the primary's, so a promoted replica
  # has the same layout and headroom.
  walStorage:
    size: 10Gi
    storageClass: pd-balanced-retain

  # Requests equal limits: Guaranteed QoS, so under node pressure the
  # database is the last pod evicted or OOM-killed, not the first.
  # Sized like the primary, so a promoted replica can take its load.
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
