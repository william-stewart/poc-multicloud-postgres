# Replica cluster: bootstraps from the primary's latest base backup in S3, then
# keeps replaying WAL from the archive. There is no network path between the
# clouds; replication lag is bounded by the primary's archive_timeout (60s).
#
# Promotion (manual, documented): set replica.enabled to false. Don't let a
# promoted cluster archive to pg-primary/; give it its own prefix or bucket.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-replica
  namespace: cnpg-db
  annotations:
    # Never let a change in git delete the database: Flux won't prune it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  # Must be the same PostgreSQL major version as the primary (18).
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
  enableSuperuserAccess: false

  replica:
    enabled: true
    source: origin

  bootstrap:
    recovery:
      source: origin

  # The primary, as seen through its archive. No WAL archiver plugin is set on
  # this cluster, so it never writes to the primary's archive.
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: aws-store-ro
          serverName: pg-primary

  storage:
    size: 10Gi
    # GKE's default class: Persistent Disk (pd-balanced), encrypted at rest.
    storageClass: standard-rwo

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
