# Replica cluster: bootstraps from the primary's latest base backup in S3, then
# keeps replaying WAL from the archive. There is no network path between the
# clouds; replication lag is bounded by the primary's archive_timeout (60s).
#
# Promotion (manual, documented): set replica.enabled to false. Don't let a
# promoted cluster archive to pg-primary/; give it its own prefix or bucket.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-replica
  namespace: cnpg-db
  annotations:
    # Never let a change in git delete the database: Flux won't prune it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  # imageName comes from k8s/data/components/postgres-image, shared with the
  # primary: replaying its WAL needs the same PostgreSQL major.
  enableSuperuserAccess: false

  replica:
    enabled: true
    source: origin

  bootstrap:
    recovery:
      source: origin

  # The primary, as seen through its archive. No WAL archiver plugin is set on
  # this cluster, so it never writes to the primary's archive.
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: aws-store-ro
          serverName: pg-primary

  storage:
    size: 10Gi
    # pd-balanced, encrypted at rest, kept when the PVC is deleted
    # (k8s/platform/gcp/storageclass.yaml).
    storageClass: pd-balanced-retain

  # WAL on its own volume, sized like the primary's, so a promoted replica
  # has the same layout and headroom.
  walStorage:
    size: 10Gi
    storageClass: pd-balanced-retain

  # Requests equal limits: Guaranteed QoS, so under node pressure the
  # database is the last pod evicted or OOM-killed, not the first.
  # Sized like the primary, so a promoted replica can take its load.
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
