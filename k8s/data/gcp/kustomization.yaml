# Replica PostgreSQL cluster on GKE, following the EKS primary by replaying
# WAL from the S3 archive and archiving its own copy to GCS. ${VARS} come from
# the flux-system/data-vars ConfigMap (make data-vars); the app-owner Secret
# from make app-credentials. Neither cloud needs a key: S3 through
# federation with GKE's OIDC issuer, GCS through Workload Identity.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The cnpg-db namespace comes from the policies layer, applied first.
resources:
  - objectstore.yaml
  - objectstore-gcs.yaml
  - cluster.yaml
  - scheduledbackup.yaml
components:
  - ../components/postgres-image
