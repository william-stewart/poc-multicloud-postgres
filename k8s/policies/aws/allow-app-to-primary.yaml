# Rule 7: applications in the app namespace may connect to the current primary
# only (CloudNativePG labels it cnpg.io/instanceRole: primary, and moves the
# label on failover). Nothing else can reach PostgreSQL.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-app-to-primary
  namespace: cnpg-db
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: pg-primary
      cnpg.io/instanceRole: primary
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: app
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
