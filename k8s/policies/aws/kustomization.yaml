# EKS: the shared rules plus IRSA's STS calls, streaming between the two
# primary instances, and reading pg-replica's GCS archive.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - allow-sts.yaml
  - allow-pg-primary-instances.yaml
  - allow-google-apis.yaml
