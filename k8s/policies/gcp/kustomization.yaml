# GKE: the shared rules plus traffic between pg-replica's own instances. No
# STS (the replica uses static, read-only keys) and no application access
# (the replica is not served to applications in this PoC).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - allow-pg-replica-instances.yaml
