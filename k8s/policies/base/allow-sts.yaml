# Rule 6: AWS STS, where database pods exchange a service account token for
# short-lived AWS credentials: IRSA's writer role on EKS, the federated reader
# role on GKE. Both set AWS_STS_REGIONAL_ENDPOINTS=regional; the global
# endpoint is kept for SDKs that ignore it. The STS region is the bucket's.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sts
  namespace: cnpg-db
spec:
  endpointSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  egress:
    - toFQDNs:
        - matchName: sts.${WAL_BUCKET_REGION}.amazonaws.com
        - matchName: sts.amazonaws.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
