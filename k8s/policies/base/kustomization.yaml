# The database and app namespaces and their network policies, shared by both
# clusters, so either side can serve applications once it is the primary.
# Default deny for every pod in cnpg-db, then Cilium rules that open exactly the
# flows the databases need. Each cloud's overlay adds its own rules.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - default-deny.yaml
  - allow-dns.yaml
  - allow-kube-apiserver.yaml
  - allow-operator-and-probes.yaml
  - allow-s3.yaml
  - allow-sts.yaml
  - app-namespace.yaml
  - allow-app-to-primary.yaml
  - allow-prometheus-scrape.yaml
