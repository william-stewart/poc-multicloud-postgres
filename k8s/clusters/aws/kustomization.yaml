# Flux entry point for the AWS cluster. Flux reconciles this directory
# from main, so it manages its own install as well as the platform, data and policies layers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../flux
  - flux-sync.yaml
  - platform.yaml
  - data.yaml
  - policies.yaml
