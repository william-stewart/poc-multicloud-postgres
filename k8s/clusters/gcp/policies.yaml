# The cnpg-db namespace and its network policies: default deny plus the flows
# the databases need. The data layer depends on this one, so no database pod
# ever runs without them. Debug a missing rule with
# `hubble observe -n cnpg-db --verdict DROPPED`, not by suspending the policies.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  dependsOn:
    - name: platform
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  path: ./k8s/policies/gcp
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: data-vars
