# Where Flux pulls from. The repo is private, so Flux authenticates with a
# read-only deploy key stored in the flux-system Secret (created by
# k8s/bootstrap.sh, never committed).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/william-stewart/poc-multicloud-postgres
  ref:
    branch: main
  secretRef:
    name: flux-system
  # Only k8s/ is relevant to the cluster.
  ignore: |
    /*
    !/k8s/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/clusters/gcp
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
