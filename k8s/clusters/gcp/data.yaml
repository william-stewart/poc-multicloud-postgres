# Database layer: the replica CloudNativePG cluster, following the EKS primary
# through the S3 archive. It needs the CRDs from the platform layer and the
# bucket name from infra/30-data/aws, which `make data-vars` stores in the
# data-vars ConfigMap. Until that ConfigMap exists, Flux reports this
# Kustomization as not ready and applies nothing.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: data
  namespace: flux-system
spec:
  dependsOn:
    - name: platform
  interval: 10m
  retryInterval: 2m
  timeout: 20m
  path: ./k8s/data/gcp
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: data-vars
