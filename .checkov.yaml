# Checkov configuration shared by pre-commit and `make validate`.
# Individual exceptions are made inline with `#checkov:skip=<ID>:<reason>`
# next to the resource, so every accepted risk is documented where it lives.
directory:
  - .
# Kubernetes manifests are scanned by scripts/validate_k8s.py after rendering
# them exactly as Flux applies them; checkov's own kustomize scanner can't
# follow this repo's layout and silently scans nothing.
framework:
  - terraform
  - github_actions
  - secrets
skip-path:
  - \.terraform
  - secrets
  # Diagnostics from failed `make e2e` and `make live-drill` runs: gitignored
  # cluster dumps whose status hashes and promotion tokens look like secrets
  # to checkov.
  - test/e2e/results
  - test/live/results
download-external-modules: true
compact: true
quiet: true
