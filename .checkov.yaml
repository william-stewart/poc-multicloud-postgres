# Checkov configuration shared by pre-commit and `make validate`.
# Individual exceptions are made inline with `#checkov:skip=<ID>:<reason>`
# next to the resource, so every accepted risk is documented where it lives.
directory:
  - .
framework:
  - terraform
  - kubernetes
  - helm
  - kustomize
  - github_actions
  - secrets
skip-path:
  - \.terraform
  - \.claude
  - secrets
  # Generated upstream Flux manifests: scanned through k8s/flux/kustomization.yaml,
  # which pins their images by digest and records the accepted findings.
  - k8s/flux/gotk-components\.yaml
download-external-modules: true
compact: true
quiet: true
